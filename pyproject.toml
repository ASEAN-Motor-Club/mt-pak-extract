[project]
name = "mt-pak-extract"
version = "0.1.0"
description = "MotorTown PAK extraction and decal pack creation tools"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mt-decal-inject = "scripts.decal_tool:inject_cli"
mt-decal-export = "scripts.decal_tool:export_cli"
mt-decal-pack = "scripts.create_decal_pack:main"

[build-system]
requires = ["hatchling", "editables"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
